name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Committed action matches the source
        if: runner.os == 'Linux'
        run: |
          pnpm build
          git diff --exit-code -- dist/action
      - run: pnpm audit

  action:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: scan
        uses: ./
        with:
          path: test/fixtures/action-repo
          feed-dir: test/fixtures/action-feed
      - name: Check the outputs
        env:
          FINDINGS: ${{ steps.scan.outputs.findings }}
          REPORT: ${{ steps.scan.outputs.report }}
        run: |
          test "$FINDINGS" = "1"
          jq -e '.findings | length == 1 and .[0].path == "src/ai.ts" and .[0].line == 2 and .[0].token == "acme-1"' "$REPORT"
